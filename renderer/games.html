<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Laufende Spiele</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="games.css">
</head>
<body class="games-win">
  <header id="gtitle"><b>Laufende Spiele</b><span id="gcount" class="muted"></span><div class="drag"></div>
    <button id="gmin" title="Minimieren">&#8211;</button><button id="gclose" title="Schließen">&#10005;</button></header>
  <main>
    <aside id="glist"></aside>
    <section>
      <div id="ghead"></div>
      <pre id="glog"></pre>
      <div id="gbar"><label><input type="checkbox" id="gfollow" checked> Mitscrollen</label><button class="btn sm" id="gcopy">Log kopieren</button><button class="btn sm ghost" id="gclear">Leeren</button></div>
    </section>
  </main>
  <script src="games.js"></script>
</body>
</html>
